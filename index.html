<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vade Mecum Inteligente | Arquitetura Moderna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Meu Vade Mecum</h1>
        <p class="subtitle">Navegação hierárquica inteligente</p>
    </header>

    <main class="app-container">
        <!-- Seletor de Leis -->
        <section class="painel-cards" role="tablist" aria-label="Selecione a legislação">
            <button class="card" role="tab" data-lei="cf" data-nome="Constituição Federal (CF/88)">CF/88</button>
            <button class="card" role="tab" data-lei="clt" data-nome="Consolidação das Leis do Trabalho">CLT</button>
            <button class="card" role="tab" data-lei="cpc" data-nome="Código de Processo Civil">CPC</button>
            <button class="card" role="tab" data-lei="cc" data-nome="Código Civil">CC</button>
            <button class="card" role="tab" data-lei="cp" data-nome="Código Penal">CP</button>
        </section>

        <!-- Área de Busca -->
        <section id="area-busca" class="busca-container" hidden>
            <h2 id="titulo-lei-selecionada" class="lei-titulo"></h2>
            
            <div class="input-grupo">
                <label for="numero-artigo" class="sr-only">Digite o número do artigo</label>
                <input type="text" id="numero-artigo" inputmode="numeric" placeholder="Ex: 5, 5º, Art. 5" autocomplete="off">
                <button id="btn-buscar" class="btn-primary">Pesquisar</button>
            </div>
            
            <!-- Container de Resultados com Acessibilidade -->
            <div id="resultado-artigo" class="resultado-container" aria-live="polite" aria-busy="false"></div>
        </section>
    </main>

    <!-- Componente Toast para Notificações -->
    <div id="toast-notificacao" class="toast" role="alert" aria-live="assertive"></div>

    <!-- Carregamento como Módulo ES6 para encapsulamento de escopo -->
    <script type="module" src="app.js"></script>
</body>
</html>
