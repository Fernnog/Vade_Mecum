<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vade Mecum Integrator</title>
    <!-- Correção: Injeção de Favicon SVG nativo para eliminar erro 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- Botão de Acesso ao Conversor (Engrenagem) -->
    <a href="conversor.html" class="config-btn" title="Acessar Conversor de Leis" aria-label="Acessar Conversor de Leis">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </a>
    <header class="app-header">
        <h1>Meu Vade Mecum</h1>
        <p class="subtitle">Navegação hierárquica inteligente</p>
    </header>

    <main class="app-container">
        <!-- Seletor de Leis -->
        <section class="painel-cards" role="tablist" aria-label="Selecione a legislação">
            <button class="card" role="tab" data-lei="cf" data-nome="Constituição Federal (CF/88)">
                <span class="card-title">CF/88</span>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </button>
            <button class="card" role="tab" data-lei="clt" data-nome="Consolidação das Leis do Trabalho">
                <span class="card-title">CLT</span>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </button>
            <button class="card" role="tab" data-lei="cpc" data-nome="Código de Processo Civil">
                <span class="card-title">CPC</span>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </button>
            <button class="card" role="tab" data-lei="cc" data-nome="Código Civil">
                <span class="card-title">CC</span>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </button>
            <button class="card" role="tab" data-lei="cp" data-nome="Código Penal">
                <span class="card-title">CP</span>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </button>
        </section>

        <!-- Área de Busca -->
        <section id="area-busca" class="busca-container" hidden>
            <h2 id="titulo-lei-selecionada" class="lei-titulo"></h2>
            
            <div class="input-grupo">
                <label for="numero-artigo" class="sr-only">Digite o artigo e sua ramificação</label>
                <!-- Placeholder educa o usuário sobre o Deep Linking -->
                <input type="text" id="numero-artigo" placeholder="Ex: 5, 5 § 1º, 5 XL" autocomplete="off">
                <button id="btn-buscar" class="btn-primary">Pesquisar</button>
            </div>
            
            <!-- Container de Resultados com Acessibilidade e Wrapper de Expansão -->
            <div id="resultado-wrapper" class="resultado-wrapper">
                <div class="resultado-controles">
                    <button id="btn-expandir" class="btn-icon" aria-label="Expandir para tela cheia" aria-pressed="false" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                    </button>
                    <button id="btn-fechar-expansao" class="btn-icon danger" aria-label="Fechar tela cheia" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div id="resultado-artigo" class="resultado-container" aria-live="polite" aria-busy="false"></div>
            </div>
        </section>
    </main>

    <!-- Componente Toast para Notificações -->
    <div id="toast-notificacao" class="toast" role="alert" aria-live="assertive"></div>

    <!-- Carregamento como Módulo ES6 para encapsulamento de escopo -->
    <script type="module" src="app.js"></script>
</body>
</html>
