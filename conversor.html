<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Leis para JSON</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f4f4f9; color: #333; max-width: 800px; margin: 0 auto; }
        h2 { color: #1a365d; }
        .editor-rico { width: 100%; height: 250px; margin-bottom: 15px; padding: 15px; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; overflow-y: auto; background: #fff; }
        .editor-rico:empty:before { content: attr(data-placeholder); color: #888; }
        /* Destaque visual: mostra pro usuário o que será ignorado pelo aspirador de pó */
        strike, s, del, [style*="line-through"], [style*="LINE-THROUGH"] { color: #a0aec0; text-decoration: line-through; background: #fed7d7; }
        
        /* Classes de Feedback */
        .feedback-sucesso {
            padding: 12px; margin-bottom: 20px; border-radius: 6px;
            background: #e6ffed; border: 1px solid #34d058; color: #1a7f37;
            font-size: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .is-hidden { display: none !important; }

        .botoes-container { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        button { padding: 10px 20px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #1a365d; }
        
        /* Estilos da área de Download */
        #area-download { display: none; background: #e2e8f0; padding: 20px; border-radius: 4px; margin-bottom: 20px; border-left: 5px solid #38a169; }
        input[type="text"] { padding: 8px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 4px; width: 150px; }
        .btn-download { background: #38a169; }
        .btn-download:hover { background: #2f855a; }
        
        pre { background: #2d3748; color: #a0aec0; padding: 15px; overflow-x: auto; max-height: 300px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Conversor do Planalto para JSON</h2>
    <p>Cole o texto completo da lei (Copiado do site do Planalto) abaixo:</p>
    
    <!-- contenteditable="true" permite colar o HTML preservando as formatações originais do Planalto -->
    <div id="textoLei" class="editor-rico" contenteditable="true" data-placeholder="Cole a página inteira do Planalto aqui (Ctrl+V)..."></div>
    
    <div class="botoes-container">
        <button onclick="converter()">1. Gerar Estrutura JSON</button>
    </div>

    <!-- Feedback Refatorado via Classe CSS -->
    <div id="feedback-limpeza" class="feedback-sucesso is-hidden">
        <strong>Limpeza Concluída:</strong> <span id="qtd-removida">0</span> nós (tachados e notas) foram podados.
    </div>

    <!-- Área de Download que só aparece após converter -->
    <div id="area-download">
        <p style="margin-top:0; font-weight:bold;">Sucesso! Digite o nome da lei para salvar:</p>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="nome-arquivo" placeholder="ex: cf, clt, cc">
            <span>.json</span>
            <button class="btn-download" onclick="baixarJSON()">2. Baixar Arquivo JSON</button>
        </div>
    </div>

    <h3>Pré-visualização do Resultado:</h3>
    <pre id="resultado"></pre>

    <script>
        let jsonFinal = ""; // Variável global para guardar o resultado

        function converter() {
            const divEditor = document.getElementById('textoLei');
            
            if(!divEditor.innerText.trim()) {
                alert("Por favor, cole algum texto antes de gerar.");
                return;
            }

            // 1. Clonagem e Anexação Oculta (Resolve C2 - Preservação de Quebras de Linha)
            const hiddenSandbox = document.createElement('div');
            hiddenSandbox.style.cssText = 'position: absolute; left: -9999px; visibility: hidden; width: 800px;';
            hiddenSandbox.innerHTML = divEditor.innerHTML;
            document.body.appendChild(hiddenSandbox);

            let nodesRemovidos = 0;

            // 2. Remoção Cirúrgica no DOM - Tachados e Estilos Inline (Resolve C3)
            const allNodes = hiddenSandbox.querySelectorAll('*');
            allNodes.forEach(el => {
                const style = el.getAttribute('style') || '';
                if (el.tagName.match(/^(STRIKE|S|DEL)$/i) || style.match(/line-through/i)) {
                    el.remove();
                    nodesRemovidos++;
                }
            });

            // 3. Poda Direcionada de Notas do Planalto (Resolve C1 e C5)
            const noteNodes = hiddenSandbox.querySelectorAll('a, font, span');
            noteNodes.forEach(el => {
                const text = el.textContent.trim();
                if (/^\((Redação dada|Incluído pel|Revogado pel|Vide|Vigência)/i.test(text)) {
                    el.remove();
                    nodesRemovidos++;
                }
            });

            // 4. Extração Segura de Texto Renderizado
            let textoLimpo = hiddenSandbox.innerText;
            document.body.removeChild(hiddenSandbox); // Cleanup imediato para liberar memória

            // 5. Faxina de Artefatos Residuais (Resolve C4)
            textoLimpo = textoLimpo.replace(/[ \t]*[-—–]{2,}[ \t]*$/gm, ''); // Trailing leaders após remoção de nota
            textoLimpo = textoLimpo.replace(/^[\s-—–]+$/gm, ''); // Linhas inteiramente mortas
            textoLimpo = textoLimpo.replace(/[ \t]{2,}/g, ' '); // Espaços duplos
            textoLimpo = textoLimpo.replace(/\n{2,}/g, '\n'); // Múltiplas quebras viram uma só

            // 6. Parser Hierárquico Avançado (Resolve C6)
            const linhas = textoLimpo.split('\n');
            let jsonLeis = {};
            let artigoAtual = null;
            
            // Ignora cabeçalhos estruturais (Livros, Títulos, Capítulos, etc)
            const REGEX_IGNORAR = /^(LIVRO|TÍTULO|CAPÍTULO|SEÇÃO|SUBSEÇÃO|PARTE)\s+[A-ZIVXLCDM]+/i;

            for(let linha of linhas) {
                linha = linha.trim();
                if(!linha || REGEX_IGNORAR.test(linha)) continue;

                const ehNovoArtigo = linha.match(/^Art\.\s*([0-9]+)[º°\.]?/i);

                if(ehNovoArtigo) {
                    artigoAtual = ehNovoArtigo[1]; 
                    jsonLeis[artigoAtual] = linha;
                } else if (artigoAtual) {
                    jsonLeis[artigoAtual] += '\n' + linha;
                }
            }

            // 7. Renderização e UI Update
            document.getElementById('qtd-removida').textContent = nodesRemovidos;
            document.getElementById('feedback-limpeza').classList.remove('is-hidden');

            jsonFinal = JSON.stringify(jsonLeis, null, 2);
            document.getElementById('resultado').textContent = jsonFinal;
            
            // Mantido com block para não quebrar o título <p> da área de download
            document.getElementById('area-download').style.display = 'block'; 
            document.getElementById('nome-arquivo').focus();
        }

        function baixarJSON() {
            let nomeInput = document.getElementById('nome-arquivo').value.trim();
            
            if(!nomeInput) {
                alert("Por favor, digite um nome para o arquivo (ex: cf).");
                return;
            }

            // Garante que não vai ter ponto no nome que o usuário digitar
            nomeInput = nomeInput.replace(".json", "");
            const nomeCompleto = nomeInput + ".json";

            // Cria um "arquivo fantasma" na memória do navegador
            const blob = new Blob([jsonFinal], { type: "application/json;charset=utf-8" });
            const linkTemporario = document.createElement("a");
            linkTemporario.href = URL.createObjectURL(blob);
            linkTemporario.download = nomeCompleto;
            
            // Força o clique no link para iniciar o download e depois apaga o link
            document.body.appendChild(linkTemporario);
            linkTemporario.click();
            document.body.removeChild(linkTemporario);
        }
    </script>
</body>
</html>
